# Temporário: gera o package-lock.json (o ambiente do Claude não alcança o npm) e grava neste ramo.
name: Gerar package-lock
on:
  push:
    branches: [claude/lockfile-gen]
permissions:
  contents: write
jobs:
  gerar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "package-lock.json gerado pelo GitHub Actions"
          git push
