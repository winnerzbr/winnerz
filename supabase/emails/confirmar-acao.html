<!-- Assunto: Seu código de confirmação do WinnerZ -->
<!-- Cole este arquivo em Supabase → Authentication → Emails → Templates → Reauthentication (aba "Source"). -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Seu código de confirmação do WinnerZ</title></head>
<body style="margin:0;padding:0;background:#07080A;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Use este código para confirmar.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#07080A;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background:#111318;border:1px solid #23262d;border-radius:18px;">
      <tr><td align="center" style="padding:36px 32px 8px;">
        <img src="{{ .SiteURL }}/brand/email-logo.png" width="96" height="53" alt="WinnerZ" style="display:block;border:0;outline:none;">
      </td></tr>
      <tr><td style="padding:18px 32px 0;font-family:Arial,Helvetica,sans-serif;color:#F3EBDD;">
        <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;font-weight:800;text-align:center;">Código de confirmação</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.55;color:#C9C1B3;text-align:center;">Use o código abaixo para confirmar o que você pediu no WinnerZ.</p>
      </td></tr>
      
      <tr><td align="center" style="padding:20px 32px 8px;font-family:Arial,Helvetica,sans-serif;">
        <p style="margin:0 0 8px;font-size:13px;color:#8D867A;">Seu código:</p>
        <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:30px;font-weight:700;letter-spacing:8px;color:#F3EBDD;">{{ .Token }}</p>
      </td></tr>
      <tr><td style="padding:8px 32px 32px;font-family:Arial,Helvetica,sans-serif;">
        <p style="margin:0;font-size:13px;line-height:1.55;color:#8D867A;text-align:center;">O código vale por alguns minutos. Se não foi você, ignore este e-mail.</p>
      </td></tr>
    </table>
    <p style="margin:18px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#5E5A53;">WinnerZ · Onde jogos viram histórias.</p>
  </td></tr>
</table>
</body>
</html>
