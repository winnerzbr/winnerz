# Confere o site a cada envio: tipos, testes e build. Se algo quebrar, o GitHub avisa antes de chegar ao público.
name: Verificação
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Instala exatamente as versões do package-lock.json (nada novo entra sem passar por aqui).
      - run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
